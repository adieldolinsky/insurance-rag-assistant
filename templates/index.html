<!DOCTYPE html>
<html dir="rtl" lang="he" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>יועץ ביטוח חכם</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-app: #eef4fb;
            --bg-panel: #ffffff;
            --bg-chat: #f6f9fc;
            --bg-sidebar: #f8f9fa;
            --blue-50: #eff6ff;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border-soft: #e8ecf1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 8px 24px rgba(37, 99, 235, 0.1);
            --shadow-card: 0 4px 24px rgba(15, 23, 42, 0.06);
        }

        html, body { height: 100%; }
        body {
            font-family: 'Heebo', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-app);
            color: var(--text-primary);
        }

        .prose-he h1, .prose-he h2, .prose-he h3 {
            font-weight: 600; margin: 0.6rem 0 0.35rem; color: var(--text-primary);
        }
        .prose-he h1 { font-size: 1.12rem; }
        .prose-he h2 { font-size: 1.05rem; }
        .prose-he ul, .prose-he ol { padding-inline-start: 1.25rem; margin: 0.4rem 0; }
        .prose-he ul { list-style: disc; }
        .prose-he p { margin: 0.4rem 0; line-height: 1.6; }
        .prose-he strong { font-weight: 600; color: #1e3a5f; }
        .prose-he table { border-collapse: collapse; width: 100%; margin: 0.55rem 0; font-size: 0.85rem; }
        .prose-he th { background: var(--blue-50); font-weight: 600; color: #1e40af; }
        .prose-he th, .prose-he td {
            border: 1px solid var(--border-soft);
            padding: 0.45rem 0.6rem;
            text-align: right;
        }

        .scroll-thin::-webkit-scrollbar { width: 6px; }
        .scroll-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }

        .agent-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 9999px;
            background: linear-gradient(145deg, #4f8ef7, var(--blue-700));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
            border: 2px solid #fff;
        }

        /* Welcome empty state */
        .welcome-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 2rem;
            min-height: 0;
        }
        .welcome-card {
            max-width: 32rem;
            width: 100%;
            text-align: center;
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: 1.5rem;
            padding: 2.75rem 2.25rem 2.25rem;
            box-shadow: var(--shadow-card);
        }
        .welcome-icon {
            width: 5.5rem;
            height: 5.5rem;
            margin: 0 auto 1.5rem;
            border-radius: 1.25rem;
            background: linear-gradient(145deg, #dbeafe, #eff6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
            margin-bottom: 0.65rem;
        }
        .welcome-subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 1.75rem;
        }
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            justify-content: center;
        }
        .quick-btn {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--blue-700);
            background: var(--blue-50);
            border: 1px solid #bfdbfe;
            border-radius: 9999px;
            padding: 0.55rem 1.15rem;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }
        .quick-btn:hover {
            background: #dbeafe;
            border-color: #93c5fd;
            transform: translateY(-1px);
        }

        /* Chat messages */
        .chat-thread { width: 100%; }
        .chat-thread.hidden { display: none; }

        .msg-row {
            margin-bottom: 1rem;
            display: flex;
            width: 100%;
        }
        .msg-row--user { justify-content: flex-start; }
        .msg-row--agent { justify-content: flex-end; }

        .bubble {
            max-width: min(92%, 52rem);
            width: fit-content;
            padding: 1rem 1.25rem;
            font-size: 0.95rem;
            line-height: 1.6;
            box-shadow: var(--shadow-sm);
        }
        .bubble--user {
            background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
            color: #fff;
            border-radius: 1.25rem 1.25rem 0.35rem 1.25rem;
            box-shadow: var(--shadow-md);
        }
        .bubble--agent {
            background: var(--bg-panel);
            color: var(--text-primary);
            border: 1px solid var(--border-soft);
            border-radius: 1.25rem 1.25rem 1.25rem 0.35rem;
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 1rem 1.25rem;
            background: var(--bg-panel);
            border: 1px solid var(--border-soft);
            border-radius: 1.25rem 1.25rem 1.25rem 0.35rem;
            box-shadow: var(--shadow-sm);
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .chat-header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-soft);
            box-shadow: var(--shadow-sm);
        }

        .composer {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-soft);
            box-shadow: 0 -2px 12px rgba(15, 23, 42, 0.04);
        }
        .composer-inner {
            background: var(--bg-chat);
            border: 1px solid var(--border-soft);
            border-radius: 1.25rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .composer-inner:focus-within {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .sidebar {
            background: var(--bg-sidebar);
            border-inline-start: 1px solid var(--border-soft);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-primary:hover:not(:disabled) {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

        .policies-title {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body class="h-screen overflow-hidden antialiased">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="sidebar w-80 shrink-0 flex flex-col">
            <div class="px-5 py-4 border-b border-slate-200/80 bg-white/50">
                <div class="flex items-center gap-3">
                    <div class="agent-avatar">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-base font-semibold text-slate-900">יועץ ביטוח חכם</h1>
                        <p class="text-xs text-slate-500">ניתוח והשוואת פוליסות</p>
                    </div>
                </div>
            </div>

            <div class="px-5 py-4 border-b border-slate-200/80">
                <input id="fileInput" type="file" accept="application/pdf" class="hidden" />
                <button id="uploadBtn" type="button"
                        class="btn-primary w-full inline-flex items-center justify-center gap-2
                               text-white text-sm font-medium rounded-xl px-4 py-2.5">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                    </svg>
                    <span>העלאת פוליסה (PDF)</span>
                </button>
                <p id="dropHint" class="text-[11px] text-slate-400 text-center mt-2">ניתן גם לגרור קובץ לכאן</p>

                <div id="uploadStatus" class="hidden mt-3 text-xs">
                    <div id="statusLoading" class="flex items-center gap-2 text-slate-600">
                        <div class="w-3.5 h-3.5 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        <span id="statusLoadingText">מעלה ומעבד מסמך...</span>
                    </div>
                    <div id="statusSuccess" class="hidden text-emerald-600">
                        <span id="statusSuccessText">המסמך הועלה בהצלחה</span>
                    </div>
                    <div id="statusError" class="hidden text-red-600">
                        <span id="statusErrorText">שגיאה בעיבוד המסמך</span>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto scroll-thin px-4 py-4">
                <div class="flex items-center justify-between mb-3 px-1">
                    <h2 class="policies-title">
                        <svg class="w-4 h-4 text-blue-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        פוליסות במאגר
                    </h2>
                    <button id="refreshBtn" type="button" title="רענון"
                            class="text-slate-400 hover:text-blue-600 transition p-1 rounded-lg hover:bg-white">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M16.023 9.348h4.992V4.356M3.985 14.652H8.977v4.992M2.36 9.348a8.25 8.25 0 0114.59-2.534M21.64 14.652a8.25 8.25 0 01-14.59 2.534" />
                        </svg>
                    </button>
                </div>
                <ul id="docList" class="space-y-2">
                    <li id="docListEmpty" class="text-slate-400 text-xs leading-relaxed px-1">
                        עדיין לא הועלו פוליסות למאגר.
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Chat area -->
        <main class="flex-1 flex flex-col min-w-0" style="background: var(--bg-chat);">
            <header class="chat-header shrink-0 px-6 py-4">
                <div class="flex items-center gap-3 max-w-5xl mx-auto w-full">
                    <div class="agent-avatar">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
                        </svg>
                    </div>
                    <h2 class="text-base font-semibold text-slate-900">יועץ הביטוח שלכם</h2>
                </div>
            </header>

            <div id="messages" class="flex-1 flex flex-col min-h-0 overflow-hidden">
                <!-- Empty state: centered welcome card -->
                <div id="welcomeCard" class="welcome-wrap">
                    <div class="welcome-card">
                        <div class="welcome-icon" aria-hidden="true">
                            <svg class="w-14 h-14 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.25">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 19.5h15a1.5 1.5 0 001.5-1.5V18a6 6 0 00-12 0v.5a1.5 1.5 0 001.5 1.5z" />
                            </svg>
                        </div>
                        <h3 class="welcome-title">שלום! אני יועץ הביטוח החכם שלך</h3>
                        <p class="welcome-subtitle">
                            העלו פוליסה ושאלו אותי על כיסויים, החזרים או השוואות בין חברות
                        </p>
                        <div class="quick-actions">
                            <button type="button" class="quick-btn" data-query="השווה בין שתי פוליסות במאגר">
                                השווה בין שתי פוליסות
                            </button>
                            <button type="button" class="quick-btn" data-query="הסבר לי על תנאי הריון בפוליסות">
                                הסבר לי על תנאי הריון
                            </button>
                            <button type="button" class="quick-btn" data-query="מה ההשתתפות העצמית בפוליסות במאגר?">
                                השתתפות עצמית בפוליסות
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Active conversation thread -->
                <div id="chatThread" class="chat-thread hidden flex-1 overflow-y-auto scroll-thin px-6 sm:px-10 py-8">
                    <div id="chatMessages" class="max-w-5xl mx-auto w-full"></div>
                </div>
            </div>

            <form id="chatForm" class="composer shrink-0 px-6 py-5">
                <div class="flex gap-3 items-end max-w-5xl mx-auto w-full composer-inner px-4 py-2.5">
                    <textarea id="chatInput" rows="1" autocomplete="off"
                              placeholder="שאלו על הפוליסה שלכם..."
                              class="flex-1 resize-none border-0 bg-transparent px-1 py-2.5 text-sm leading-6
                                     max-h-36 overflow-y-auto scroll-thin
                                     focus:outline-none focus:ring-0 text-right placeholder:text-slate-400"></textarea>
                    <button type="submit" id="sendBtn"
                            class="btn-primary shrink-0 inline-flex items-center justify-center
                                   text-white rounded-xl w-11 h-11 disabled:opacity-50">
                        <svg class="w-5 h-5 -scale-x-100" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const dropHint = document.getElementById('dropHint');
        const uploadStatus = document.getElementById('uploadStatus');
        const statusLoading = document.getElementById('statusLoading');
        const statusSuccess = document.getElementById('statusSuccess');
        const statusError = document.getElementById('statusError');
        const statusLoadingText = document.getElementById('statusLoadingText');
        const statusSuccessText = document.getElementById('statusSuccessText');
        const statusErrorText = document.getElementById('statusErrorText');
        const docList = document.getElementById('docList');
        const docListEmpty = document.getElementById('docListEmpty');
        const refreshBtn = document.getElementById('refreshBtn');
        const welcomeCard = document.getElementById('welcomeCard');
        const chatThread = document.getElementById('chatThread');
        const chatMessages = document.getElementById('chatMessages');
        const messagesScroller = document.getElementById('messages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let statusHideTimer = null;
        let conversationStarted = false;

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str ?? '';
            return d.innerHTML;
        }

        function hideWelcome() {
            if (!conversationStarted) {
                conversationStarted = true;
                welcomeCard.classList.add('hidden');
                chatThread.classList.remove('hidden');
            }
        }

        const BADGE_PALETTE = [
            'bg-blue-50 text-blue-700',
            'bg-sky-50 text-sky-700',
            'bg-emerald-50 text-emerald-700',
        ];
        function badgeClass(company) {
            let hash = 0;
            for (let i = 0; i < company.length; i++) hash = (hash * 31 + company.charCodeAt(i)) >>> 0;
            return BADGE_PALETTE[hash % BADGE_PALETTE.length];
        }

        function renderPolicies(policies) {
            docList.querySelectorAll('li.doc-item').forEach(el => el.remove());
            if (!policies || !policies.length) {
                docListEmpty.classList.remove('hidden');
                return;
            }
            docListEmpty.classList.add('hidden');
            policies
                .slice()
                .sort((a, b) => (a.company || '').localeCompare(b.company || ''))
                .forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'doc-item flex items-center gap-2.5 p-2.5 rounded-xl border border-white bg-white/80 hover:bg-white transition shadow-sm';
                    const tierLabel = p.tier && p.tier !== 'Unknown' ? ` · ${escapeHtml(p.tier)}` : '';
                    li.innerHTML = `
                        <div class="min-w-0 flex-1 text-right">
                            <p class="text-sm font-medium text-slate-800 truncate">${escapeHtml(p.filename)}</p>
                            <p class="text-[10px] text-slate-400">${escapeHtml(p.company || 'לא ידוע')}${tierLabel}</p>
                        </div>
                        <span class="shrink-0 text-[10px] font-semibold px-2 py-0.5 rounded-full ${badgeClass(p.company || 'NA')}">
                            ${escapeHtml(p.company || '?')}
                        </span>`;
                    docList.appendChild(li);
                });
        }

        async function loadPolicies(force = false) {
            try {
                const res = await fetch('/policies' + (force ? '?refresh=1' : ''));
                const data = await res.json();
                renderPolicies(data.policies || []);
            } catch { /* keep list */ }
        }

        function setUploadBusy(busy) { uploadBtn.disabled = busy; }

        function showLoading(text = 'מעלה ומעבד מסמך...') {
            clearTimeout(statusHideTimer);
            uploadStatus.classList.remove('hidden');
            statusLoading.classList.remove('hidden');
            statusSuccess.classList.add('hidden');
            statusError.classList.add('hidden');
            statusLoadingText.textContent = text;
            setUploadBusy(true);
        }
        function showSuccess(text = 'המסמך הועלה בהצלחה') {
            statusLoading.classList.add('hidden');
            statusSuccess.classList.remove('hidden');
            statusError.classList.add('hidden');
            statusSuccessText.textContent = text;
            setUploadBusy(false);
            statusHideTimer = setTimeout(() => uploadStatus.classList.add('hidden'), 4000);
        }
        function showError(text = 'שגיאה בעיבוד המסמך') {
            statusLoading.classList.add('hidden');
            statusSuccess.classList.add('hidden');
            statusError.classList.remove('hidden');
            statusErrorText.textContent = text;
            setUploadBusy(false);
        }

        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) uploadFile(fileInput.files[0]);
            fileInput.value = '';
        });
        ['dragover', 'dragenter'].forEach(evt => {
            document.body.addEventListener(evt, e => {
                e.preventDefault();
                dropHint.classList.add('text-blue-600');
            });
        });
        ['dragleave', 'drop'].forEach(evt => {
            document.body.addEventListener(evt, e => {
                e.preventDefault();
                dropHint.classList.remove('text-blue-600');
            });
        });
        document.body.addEventListener('drop', e => {
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });

        async function uploadFile(file) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                uploadStatus.classList.remove('hidden');
                showError('יש להעלות קובץ PDF בלבד');
                return;
            }
            showLoading();
            try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.status === 202) pollStatus(data.job_id);
                else showError(data.error || 'שגיאה בהעלאה');
            } catch {
                showError('שגיאת רשת. נסו שוב.');
            }
        }

        function pollStatus(jobId) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/status/${jobId}`);
                    const data = await res.json();
                    if (data.state === 'done') {
                        clearInterval(interval);
                        showSuccess(data.message || 'המסמך הועלה בהצלחה');
                        loadPolicies(true);
                    } else if (data.state === 'error') {
                        clearInterval(interval);
                        showError(data.message || 'שגיאה בעיבוד המסמך');
                    } else {
                        showLoading('מעלה ומעבד מסמך...');
                    }
                } catch {
                    clearInterval(interval);
                    showError('שגיאה בבדיקת הסטטוס');
                }
            }, 2500);
        }

        refreshBtn.addEventListener('click', () => loadPolicies(true));

        function scrollChat() {
            chatThread.scrollTop = chatThread.scrollHeight;
        }

        function addMessage(content, role, isMarkdown = false) {
            hideWelcome();
            const row = document.createElement('div');
            if (role === 'user') {
                row.className = 'msg-row msg-row--user';
                const bubble = document.createElement('div');
                bubble.className = 'bubble bubble--user whitespace-pre-wrap';
                bubble.textContent = content;
                row.appendChild(bubble);
            } else if (role === 'typing') {
                row.className = 'msg-row msg-row--agent';
                row.innerHTML = `
                    <div class="typing-bubble" aria-label="היועץ מקליד">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>`;
            } else {
                row.className = 'msg-row msg-row--agent';
                const bubble = document.createElement('div');
                bubble.className = 'bubble bubble--agent prose-he';
                bubble.innerHTML = isMarkdown ? marked.parse(content) : content;
                row.appendChild(bubble);
            }
            chatMessages.appendChild(row);
            scrollChat();
            return row;
        }

        function autoGrow() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 144) + 'px';
        }
        chatInput.addEventListener('input', autoGrow);
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        async function sendQuery(query) {
            hideWelcome();
            addMessage(query, 'user');
            const typing = addMessage('', 'typing');
            sendBtn.disabled = true;
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query }),
                });
                const data = await res.json();
                typing.remove();
                if (res.ok) addMessage(data.answer, 'bot', true);
                else addMessage(`שגיאה: ${data.error || 'תקלה לא ידועה'}`, 'bot');
            } catch {
                typing.remove();
                addMessage('שגיאת רשת. נסו שוב.', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        }

        chatForm.addEventListener('submit', e => {
            e.preventDefault();
            const query = chatInput.value.trim();
            if (!query) return;
            chatInput.value = '';
            autoGrow();
            sendQuery(query);
        });

        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const q = btn.getAttribute('data-query');
                if (q) sendQuery(q);
            });
        });

        loadPolicies(true);
    </script>
</body>
</html>
